<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640"><style>.b{fill:#f3f6fb;stroke:#26364a;stroke-width:2;rx:14}.t{font-family:Arial,sans-serif;font-size:18px;fill:#162235}.s{font-family:Arial,sans-serif;font-size:14px;fill:#162235}.a{stroke:#26364a;stroke-width:2;fill:none;marker-end:url(#m)}</style><defs><marker id="m" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#26364a"/></marker></defs><rect class="b" x="320" y="25" width="360" height="75"/><text class="t" x="500" y="55" text-anchor="middle">Markdown corpus</text><text class="s" x="500" y="78" text-anchor="middle">Handbook pages + metadata</text><path class="a" d="M500 100 V140"/><rect class="b" x="320" y="140" width="360" height="80"/><text class="t" x="500" y="175" text-anchor="middle">Clean + heading-aware chunking</text><text class="s" x="500" y="198" text-anchor="middle">Chunks · titles · sections · URLs</text><path class="a" d="M500 220 V260 H270 V300"/><path class="a" d="M500 260 H730 V300"/><rect class="b" x="90" y="300" width="360" height="90"/><text class="t" x="270" y="340" text-anchor="middle">BM25 index</text><text class="s" x="270" y="365" text-anchor="middle">Lexical ranking</text><rect class="b" x="550" y="300" width="360" height="90"/><text class="t" x="730" y="340" text-anchor="middle">Embedding index</text><text class="s" x="730" y="365" text-anchor="middle">MiniLM · cosine similarity</text><path class="a" d="M270 390 V430 H500"/><path class="a" d="M730 390 V430 H500"/><rect class="b" x="320" y="430" width="360" height="70"/><text class="t" x="500" y="470" text-anchor="middle">Hybrid retrieval · RRF</text><path class="a" d="M500 500 V530"/><rect class="b" x="320" y="530" width="360" height="75"/><text class="t" x="500" y="560" text-anchor="middle">Refusal gate + grounded answer</text><text class="s" x="500" y="585" text-anchor="middle">Citations · FastAPI · Streamlit</text></svg>
